<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>文章编辑 - 一键发布到知乎</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap">
  <script src="./assets/tinymce/tinymce.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Noto Sans SC', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: linear-gradient(180deg, #f6f8fb 0%, #ffffff 40%);
      color: #1f2329;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 48px);
    }
    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }
    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
    }
    .download-link {
      color: #d4380d;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid rgba(212, 56, 13, 0.35);
      border-radius: 999px;
      padding: 6px 16px;
      background: rgba(212, 56, 13, 0.08);
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .download-link::before {
      content: '\26A0';
      font-size: 16px;
    }
    .download-link:hover {
      background: rgba(212, 56, 13, 0.16);
      border-color: rgba(212, 56, 13, 0.55);
      transform: translateY(-1px);
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 24px;
      flex: 1;
    }
    .panel {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(15, 37, 64, 0.08);
      border: 1px solid rgba(22, 119, 255, 0.08);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .editor-panel {
      padding: 32px 32px 28px;
      gap: 16px;
    }
    .title {
      width: 100%;
      padding: 14px 16px;
      font-size: 18px;
      border: 1px solid #d0d7de;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .title:focus {
      border-color: #1677ff;
      box-shadow: 0 0 0 4px rgba(22, 119, 255, 0.15);
    }
    .editor-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #d0d7de;
      background: #ffffff;
      min-height: 340px;
    }
    .editor-shell .tox {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .editor-shell .tox .tox-sidebar-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
    }
    .editor-shell .tox .tox-edit-area {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    .editor-shell .tox .tox-edit-area__iframe {
      height: 100% !important;
    }
    button.primary {
      background: linear-gradient(135deg, #1677ff 0%, #4096ff 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    button.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(22, 119, 255, 0.3);
    }
    .publish-sidebar__action {
      padding: 10px 18px;
      font-size: 13px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 6px 18px rgba(22, 119, 255, 0.22);
    }
    .publish-sidebar__action:hover {
      box-shadow: 0 10px 28px rgba(22, 119, 255, 0.28);
    }
    .publish-sidebar {
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: relative;
    }
    .sidebar-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .sidebar-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: #0f1f4b;
    }
    .channel-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .channel-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 18px 20px;
      border-radius: 16px;
      border: 1px solid rgba(22, 119, 255, 0.12);
      background: #f7f9fc;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .channel-card.is-expanded {
      border-color: rgba(22, 119, 255, 0.32);
      background: #ffffff;
      box-shadow: 0 14px 32px rgba(22, 119, 255, 0.12);
    }
    .channel-card[data-disabled="true"] {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .channel-card[data-disabled="true"] .channel-toggle,
    .channel-card[data-disabled="true"] .channel-refresh {
      pointer-events: none;
      filter: grayscale(0.3);
    }
    .channel-card__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .channel-card__info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .channel-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      flex-shrink: 0;
    }
    .channel-icon--zhihu { background: linear-gradient(135deg, #2979ff, #1e5ad7); }
    .channel-icon--xiaohongshu { background: linear-gradient(135deg, #ff2442, #ff6b9d); }
    .channel-icon--placeholder { background: linear-gradient(135deg, #a6adb7, #818a99); }
    .channel-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .channel-name {
      font-size: 15px;
      font-weight: 600;
      color: #1f2329;
    }
    .channel-card__actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .channel-body__header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 12px;
    }
    .channel-refresh {
      border: 1px solid rgba(22, 119, 255, 0.22);
      background: rgba(22, 119, 255, 0.12);
      color: #165996;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .channel-refresh:hover:not([disabled]) {
      background: rgba(22, 119, 255, 0.18);
      border-color: rgba(22, 119, 255, 0.42);
      color: #0f1f4b;
      box-shadow: 0 6px 16px rgba(22, 119, 255, 0.18);
    }
    .channel-refresh[disabled] {
      opacity: 0.6;
      cursor: wait;
      box-shadow: none;
    }
    .channel-publish {
      border: 1px solid rgba(255, 36, 66, 0.22);
      background: rgba(255, 36, 66, 0.12);
      color: #d4380d;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .channel-publish:hover:not([disabled]) {
      background: rgba(255, 36, 66, 0.18);
      border-color: rgba(255, 36, 66, 0.42);
      color: #a0260a;
      box-shadow: 0 6px 16px rgba(255, 36, 66, 0.18);
    }
    .channel-publish[disabled] {
      opacity: 0.6;
      cursor: wait;
      box-shadow: none;
    }
    .channel-toggle {
      position: relative;
      display: inline-flex;
      width: 46px;
      height: 26px;
    }
    .channel-toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #d0d7de;
      border-radius: 999px;
      transition: background 0.2s ease;
      cursor: pointer;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      height: 20px;
      width: 20px;
      left: 3px;
      top: 3px;
      background: #ffffff;
      border-radius: 50%;
      transition: transform 0.2s ease;
      box-shadow: 0 4px 12px rgba(15, 37, 64, 0.2);
    }
    .channel-toggle input:checked + .toggle-slider {
      background: linear-gradient(135deg, #1677ff, #4096ff);
    }
    .channel-toggle input:checked + .toggle-slider::before {
      transform: translateX(20px);
    }
    .channel-body {
      border: 1px solid rgba(22, 119, 255, 0.14);
      border-radius: 14px;
      padding: 16px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .channel-body[hidden] {
      display: none;
    }
    .channel-status {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.6;
      border: 1px solid rgba(247, 144, 9, 0.3);
      background: rgba(247, 144, 9, 0.12);
      color: #8a4b0b;
    }
    .channel-status[hidden] {
      display: none;
    }
    .channel-status[data-variant="info"] {
      border-color: rgba(22, 119, 255, 0.28);
      background: rgba(22, 119, 255, 0.12);
      color: #0f1f4b;
    }
    .channel-status[data-variant="success"] {
      border-color: rgba(34, 197, 94, 0.3);
      background: rgba(34, 197, 94, 0.12);
      color: #166534;
    }
    .channel-status__icon {
      font-size: 16px;
      line-height: 1;
      margin-top: 2px;
    }
    .channel-status__body {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .channel-status__text {
      margin: 0;
    }
    .channel-status__action {
      align-self: flex-start;
      background: none;
      border: none;
      padding: 0;
      font-size: 13px;
      color: #1677ff;
      cursor: pointer;
      font-weight: 600;
    }
    .channel-status__action[hidden] {
      display: none;
    }
    .channel-status__action:disabled {
      color: #98a2b3;
      cursor: not-allowed;
      text-decoration: none;
    }
    .channel-status__action:hover:not([disabled]) {
      text-decoration: underline;
    }
    .channel-placeholder {
      border: 1px dashed rgba(22, 119, 255, 0.2);
      border-radius: 14px;
      padding: 16px;
      background: rgba(22, 119, 255, 0.06);
      color: #98a2b3;
      font-size: 13px;
      line-height: 1.6;
    }
    .config-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .config-field label {
      font-size: 13px;
      color: #4e5969;
    }
    .config-field input,
    .config-field select,
    .config-field textarea {
      border: 1px solid #d0d7de;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .config-field textarea {
      resize: vertical;
      min-height: 72px;
    }
    .config-field input:focus,
    .config-field select:focus,
    .config-field textarea:focus {
      border-color: rgba(22, 119, 255, 0.5);
      box-shadow: 0 0 0 4px rgba(22, 119, 255, 0.16);
    }
    .sidebar-footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 8px;
      border-top: 1px solid rgba(22, 119, 255, 0.1);
    }
    .sidebar-meta {
      font-size: 12px;
      color: #98a2b3;
    }
    .sidebar-footer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .sidebar-footer-actions button {
      border: 1px solid rgba(22, 119, 255, 0.18);
      background: rgba(22, 119, 255, 0.1);
      color: #1677ff;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .sidebar-footer-actions button:hover {
      background: rgba(22, 119, 255, 0.16);
      border-color: rgba(22, 119, 255, 0.35);
    }
    .sidebar-footer-actions a {
      font-size: 12px;
      color: #0f1f4b;
      text-decoration: none;
      font-weight: 600;
    }
    .sidebar-footer-actions a:hover {
      text-decoration: underline;
    }
    @media (max-width: 1024px) {
      .workspace {
        grid-template-columns: 1fr;
      }
      .publish-sidebar {
        order: -1;
      }
    }
    @media (max-width: 720px) {
      body { padding: 16px; }
      .header { flex-direction: column; align-items: flex-start; }
      .header h1 { font-size: 24px; }
      .editor-panel { padding: 24px 20px; }
      .publish-sidebar { padding: 20px 18px; }
      .actions { flex-direction: column; align-items: stretch; }
      button.primary { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>文章编辑 / 发布面板</h1>
      <div style="display: flex; gap: 12px; align-items: center;">
        <a class="download-link" href="./history.html" style="background: rgba(22, 119, 255, 0.08); border-color: rgba(22, 119, 255, 0.35); color: #1677ff;">

    <div class="workspace">
      <section class="panel editor-panel">

  <script type="module">
    import {
      fetchChannelAccounts,
      getChannelLoginStatus,
      startLoginSession,
      pollLoginSessionStatus,
      fetchXiaohongshuAccounts,
      getXiaohongshuLoginStatus,
      startXiaohongshuLoginSession,
      pollXiaohongshuLoginStatus,
      publishToXiaohongshu,
      savePublishHistory
    } from './session-service.js';

    const EDITOR_ID = 'editor';
    let isMarkdownMode = false;

    /**
     * 将Markdown转换为HTML
     * @param {string} markdown - Markdown文本
     * @returns {string} HTML文本
     */
    function markdownToHtml(markdown) {
      if (typeof marked === 'undefined') {
        console.warn('marked.js未加载，无法转换Markdown');
        return markdown;
      }
      try {
        return marked.parse(markdown);
      } catch (error) {
        console.error('Markdown转换失败:', error);
        return markdown;
      }
    }

    /**
     * 将HTML转换为Markdown（简化版，仅处理基本格式）
     * @param {string} html - HTML文本
     * @returns {string} Markdown文本
     */
    function htmlToMarkdown(html) {
      if (!html) return '';
      
      // 创建临时DOM元素
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = html;
      
      // 简单的HTML到Markdown转换
      let markdown = tempDiv.textContent || tempDiv.innerText || '';
      
      // 处理换行
      markdown = markdown.replace(/\n{3,}/g, '\n\n');
      
      return markdown.trim();
    }

    /**
     * 将Markdown或HTML转换为纯文本（用于小红书发布）
     * @param {string} content - Markdown或HTML内容
     * @param {boolean} isMarkdown - 是否为Markdown格式
     * @returns {string} 纯文本
     */
    function markdownToPlainText(content, isMarkdown = false) {
      if (!content) return '';
      
      let text = '';
      
      if (isMarkdown) {
        // 如果是Markdown，先转为HTML再提取文本
        const html = markdownToHtml(content);
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = html;
        text = tempDiv.textContent || tempDiv.innerText || '';
      } else {
        // 如果是HTML，直接提取文本
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = content;
        text = tempDiv.textContent || tempDiv.innerText || '';
      }
      
      // 清理多余空白字符
      text = text
        .replace(/\n{3,}/g, '\n\n')  // 多个换行合并为两个
        .replace(/[ \t]+/g, ' ')      // 多个空格合并为一个
        .trim();
      
      return text;
    }

    /**
     * 切换Markdown/HTML模式

    function toggleMarkdownMode() {
      const editor = tinymce.get(EDITOR_ID);
      if (!editor) return;

      isMarkdownMode = !isMarkdownMode;
      const currentContent = editor.getContent({ format: 'html' });

      if (isMarkdownMode) {
        // 切换到Markdown模式：HTML -> Markdown
        const markdown = htmlToMarkdown(currentContent);
        editor.setContent(markdown, { format: 'text' });
        editor.mode.set('source'); // 切换到源代码模式
      } else {
        // 切换到HTML模式：Markdown -> HTML
        if (editor.mode.get() === 'source') {
          const sourceContent = editor.getContent({ format: 'text' });
          const html = markdownToHtml(sourceContent);
          editor.mode.set('design');
          editor.setContent(html, { format: 'html' });
        }
      }

      updateMarkdownButton();
    }

    function setupMessageBridge(targetWindow, task) {
      // 确保只有知乎平台才执行此函数
      if (task.platform !== 'zhihu') {
        console.warn('setupMessageBridge 只支持知乎平台，当前平台:', task.platform);
        return;
      }
      
      const expectedTaskId = task.taskId;
      let handshakeReceived = false;
      let taskCompleted = false;
      const handshakeMessage = 'AIFA_PUBLISH_REQUEST';

      let handshakeRetryTimer = null;
      let handshakeTimeoutTimer = null;
      let responseTimeoutTimer = null;

      const cleanup = () => {
        if (handshakeRetryTimer) {
          clearTimeout(handshakeRetryTimer);
          handshakeRetryTimer = null;
        }
        if (handshakeTimeoutTimer) {
          clearTimeout(handshakeTimeoutTimer);
          handshakeTimeoutTimer = null;
        }
        if (responseTimeoutTimer) {
          clearTimeout(responseTimeoutTimer);
          responseTimeoutTimer = null;
        }
        window.removeEventListener('message', onMessage);
      };

      const onMessage = (event) => {
        if (event.data?.type === 'AIFA_TASK_RESULT') {
          if (event.data.taskId !== expectedTaskId) {
            return;
          }
          taskCompleted = true;
          const { status, url, error } = event.data;
          if (status === 'success') {
            alert('发布成功：' + (url || '已保存至知乎草稿箱'));
            // 保存发布历史
            try {
              saveHistoryAfterPublish(task, {
                success: true,
                url: url || '',
                message: '发布成功'
              });
            } catch (historyError) {
              console.error('保存发布历史失败:', historyError);
            }
          } else {
            alert('发布失败：' + (error || '未知错误'));
            // 保存失败历史
            try {
              saveHistoryAfterPublish(task, {
                success: false,
                message: error || '发布失败'
              });
            } catch (historyError) {
              console.error('保存失败历史失败:', historyError);
            }
          }
          cleanup();
          return;
        }

        if (event.source !== targetWindow) return;

        if (event.data?.type === 'AIFA_READY' && event.data.platform === 'zhihu') {
          handshakeReceived = true;
          if (handshakeRetryTimer) {
            clearTimeout(handshakeRetryTimer);
            handshakeRetryTimer = null;
          }
          if (handshakeTimeoutTimer) {
            clearTimeout(handshakeTimeoutTimer);
            handshakeTimeoutTimer = null;
          }

          setTimeout(() => {
            try {
              targetWindow.postMessage(task, '*');
              responseTimeoutTimer = setTimeout(() => {
                if (taskCompleted) return;
                // 再次确认是知乎平台才显示错误
                if (task.platform === 'zhihu') {
                  alert('未收到扩展响应，请确认扩展已启用并重试');
                }
                cleanup();
              }, 30000);
            } catch (error) {
              cleanup();
            }
          }, 400);
        }
      };

      window.addEventListener('message', onMessage);

      try {
        targetWindow.postMessage(handshakeMessage, '*');
      } catch (e) {
        alert('无法打开或与发布页面通信，请检查弹窗是否被拦截');
        cleanup();
        return;
      }

      handshakeRetryTimer = setTimeout(() => {
        if (handshakeReceived) return;
        try {
          targetWindow.postMessage(handshakeMessage, '*');
        } catch (error) {
          throw error;
        }
      }, 3000);

      handshakeTimeoutTimer = setTimeout(() => {
        if (handshakeReceived) return;
        alert('未收到扩展握手，请确认扩展已启用并重试');
        cleanup();
      }, 10000);
    }

    /**
     * 保存发布历史记录
     * @param {Object} task - 发布任务
     * @param {Object} result - 发布结果
     */
    function saveHistoryAfterPublish(task, result) {
      try {
        const editorInstance = tinymce.get(EDITOR_ID);
        let content = '';
        if (editorInstance) {
          if (isMarkdownMode && editorInstance.mode.get() === 'source') {
            content = editorInstance.getContent({ format: 'text' });
          } else {
            content = editorInstance.getContent({ format: 'html' });
          }
        }
        
        // 截取内容前200字符作为预览
        const contentPreview = content.length > 200 ? content.substring(0, 200) + '...' : content;
        
        // 获取账号名称
        let accountName = '';
        if (task.platform === 'xiaohongshu') {
          const accountSelect = document.getElementById('xiaohongshuAccountSelect');
          if (accountSelect) {
            const selectedOption = accountSelect.options[accountSelect.selectedIndex];
            accountName = selectedOption ? selectedOption.text : task.payload.accountId;
          }
        } else if (task.platform === 'zhihu') {
          const accountSelect = document.getElementById('zhihuAccountSelect');
          if (accountSelect) {
            const selectedOption = accountSelect.options[accountSelect.selectedIndex];
            accountName = selectedOption ? selectedOption.text : '默认账号';
          }
        }
        
        savePublishHistory({
          platform: task.platform,
          title: task.payload.title,
          content: contentPreview,
          url: result.url || '',
          accountId: task.payload.accountId || '',
          accountName: accountName,
          status: result.success !== false ? 'success' : 'failed',
          message: result.message || ''
        });
      } catch (error) {
        console.error('保存发布历史失败:', error);
        // 不影响发布流程
      }
    }

      function stopPolling() {
        if (pollingTimer) {
          clearTimeout(pollingTimer);

      function scheduleNextPoll(sessionToken, delay = 2000) {
        stopPolling();
        isPolling = true;
        currentSessionToken = sessionToken;
        pollingTimer = setTimeout(async () => {
          await pollLoginStatus(sessionToken);
        }, delay);
      }

      async function pollLoginStatus(sessionToken) {
        try {
          const result = await pollLoginSessionStatus(sessionToken);
          const status = result?.status || 'expired';

          if (status === 'success') {
            stopPolling();
            nextLoginStatus = 'authenticated';
            hideStatus();
            await refreshChannelLoginStatus();
            return;
          }

          if (status === 'pending') {
            showStatus({ message: '等待扫码确认...', action: 'waiting', variant: 'info' });
            scheduleNextPoll(sessionToken);
            return;
          }

          if (status === 'qr_expired') {
            stopPolling();
            showStatus({ message: '二维码已过期，请重新获取二维码登录', action: 'relogin' });
            return;

          stopPolling();
          showStatus({ message: '账号登录状态异常，请重新登录', action: 'relogin' });

          console.error('[editor] 轮询登录状态失败', error);
          stopPolling();
          showStatus({ message: '检查登录状态失败，请重新登录', action: 'relogin' });
        }

      function showQrModal(qrCodeUrl, expiresAt) {
        const modalId = 'zhihuLoginModal';
        let modal = document.getElementById(modalId);
        if (!modal) {
          modal = document.createElement('div');
          modal.id = modalId;
          modal.className = 'modal is-visible';
          modal.innerHTML = `
            <div class="modal__backdrop"></div>
            <div class="modal__content modal__content--medium">
              <div class="modal__header">
                <h3>知乎账号登录</h3>
                <button type="button" class="modal__close" aria-label="关闭登录窗口">×</button>
              </div>
              <div class="modal__body">
                <div class="qr-block">
                  <img class="qr-block__image" alt="知乎登录二维码" />
                  <div class="qr-block__meta">
                    <p class="qr-block__title">请使用知乎 App 扫码登录</p>
                    <p class="qr-block__desc">二维码在 2 分钟内有效，过期后可重新获取</p>
                  </div>
                </div>
              </div>
              <div class="modal__footer">
                <button type="button" class="secondary" data-action="cancel">取消</button>
              </div>
            </div>`;
          document.body.appendChild(modal);

          const closeModal = () => {
            stopPolling();
            modal.classList.remove('is-visible');
            setTimeout(() => modal?.remove(), 200);
          };

          modal.querySelector('.modal__close')?.addEventListener('click', closeModal);
          modal.querySelector('[data-action="cancel"]')?.addEventListener('click', closeModal);
          modal.querySelector('.modal__backdrop')?.addEventListener('click', closeModal);
        }

        const qrImage = modal.querySelector('.qr-block__image');
        qrImage?.setAttribute('src', qrCodeUrl);
        qrImage?.setAttribute('data-expires-at', expiresAt || '');

        modal.classList.add('is-visible');
      }

      async function refreshChannelLoginStatus() {
        if (!zhihuElements.select) return;

        const selectedAccountId = zhihuElements.select.value;
        if (!selectedAccountId) {
          hideStatus();
          return;
        }

        try {
          const loginInfo = await getChannelLoginStatus('zhihu', selectedAccountId);
          const status = loginInfo?.status || 'expired';
          nextLoginStatus = status;

          if (status === 'authenticated') {
            hideStatus();
            return;
          }

          if (status === 'pending') {
            showStatus({ message: '等待扫码确认...', action: 'waiting', variant: 'info' });
            if (!isPolling && loginInfo?.sessionToken) {
              scheduleNextPoll(loginInfo.sessionToken, 2000);
            }
            return;
          }

          showStatus({ message: '账号登录状态异常，请重新登录', action: 'relogin' });
        } catch (error) {
          console.error('[editor] 获取登录状态失败', error);
          showStatus({ message: '无法获取登录状态，请稍后重试', action: 'relogin' });
        }
      }

      async function refreshChannelAccounts() {
        try {
          const accounts = await fetchChannelAccounts('zhihu');
          if (!accounts || accounts.length === 0) {
            return;
          }

          const previousValue = zhihuElements.select.value;
          zhihuElements.select.innerHTML = '';
          accounts.forEach((account) => {
            const option = document.createElement('option');
            option.value = account.account_id;
            option.textContent = account.account_name;
            zhihuElements.select.appendChild(option);
          });

          if (previousValue && accounts.some((item) => item.account_id === previousValue)) {
            zhihuElements.select.value = previousValue;
          }
        } catch (error) {
          console.error('[editor] 获取账号列表失败', error);
        }
      }

      async function initializeChannelConfig() {
        try {
          await refreshChannelAccounts();
          await refreshChannelLoginStatus();
        } finally {
          loginStatusInitializePromise = null;
        }
      }

      function ensureInitialLoad() {
        if (!loginStatusInitializePromise) {
          loginStatusInitializePromise = initializeChannelConfig();
        }
        return loginStatusInitializePromise;
      }

      // ==================== 小红书相关函数 ====================

      let xiaohongshuLoginStatusInitializePromise = null;

      /**
       * 刷新小红书账号列表
       */
      async function refreshXiaohongshuAccounts() {
        try {
          const accounts = await fetchXiaohongshuAccounts();
          if (!accounts || accounts.length === 0) {
            console.warn('[editor] 小红书账号列表为空');
            return;
          }

          const previousValue = xiaohongshuElements.select.value;
          xiaohongshuElements.select.innerHTML = '';
          accounts.forEach((account) => {
            const option = document.createElement('option');
            option.value = account.account_id || account.id;
            option.textContent = account.account_name || account.name || account.account_id || account.id;
            xiaohongshuElements.select.appendChild(option);
          });

          if (previousValue && accounts.some((item) => (item.account_id || item.id) === previousValue)) {
            xiaohongshuElements.select.value = previousValue;
          } else if (accounts.length > 0) {
            // 如果没有之前的选中值，默认选择第一个
            xiaohongshuElements.select.value = accounts[0].account_id || accounts[0].id;
          }
        } catch (error) {
          console.error('[editor] 获取小红书账号列表失败', error);
        }
      }

      /**
       * 刷新小红书登录状态
       */
      async function refreshXiaohongshuLoginStatus() {
        if (!xiaohongshuElements.select) return;

        const selectedAccountId = xiaohongshuElements.select.value;
        if (!selectedAccountId) {
          hideXiaohongshuStatus();
          return;
        }

        try {
          const loginInfo = await getXiaohongshuLoginStatus(selectedAccountId);
          const status = loginInfo?.status || 'expired';

          // 支持多种登录状态值：active（后端返回）、authenticated、logged_in
          if (status === 'active' || status === 'authenticated' || status === 'logged_in') {
            hideXiaohongshuStatus();
            return;
          }

          if (status === 'pending') {
            showXiaohongshuStatus({ message: '等待扫码确认...', action: 'waiting', variant: 'info' });
            return;
          }

          showXiaohongshuStatus({ message: '账号登录状态异常，请重新登录', action: 'relogin' });
        } catch (error) {
          console.error('[editor] 获取小红书登录状态失败', error);
          showXiaohongshuStatus({ message: '无法获取登录状态，请稍后重试', action: 'relogin' });
        }
      }

      /**
       * 初始化小红书通道配置
       */
      async function initializeXiaohongshuConfig() {
        try {
          await refreshXiaohongshuAccounts();
          await refreshXiaohongshuLoginStatus();
        } finally {
          xiaohongshuLoginStatusInitializePromise = null;
        }
      }

      /**
       * 确保小红书配置已加载
       */
      function ensureXiaohongshuInitialLoad() {
        if (!xiaohongshuLoginStatusInitializePromise) {
          xiaohongshuLoginStatusInitializePromise = initializeXiaohongshuConfig();
        }
        return xiaohongshuLoginStatusInitializePromise;
      }

      /**
       * 启动小红书登录流程
       */
      async function startXiaohongshuLoginFlow() {
        if (!xiaohongshuElements.select) return;
        const selectedAccountId = xiaohongshuElements.select.value;
        if (!selectedAccountId) {
          alert('请先选择账号');
          return;
        }

        try {
          xiaohongshuElements.reloginButton.disabled = true;
          xiaohongshuElements.reloginButton.textContent = '启动登录中...';

          // 小红书登录是同步的，会等待用户扫码完成后才返回
          showXiaohongshuStatus({ message: '浏览器将自动打开登录页面，请使用小红书APP扫码登录', action: 'waiting', variant: 'info' });
          
          const sessionInfo = await startXiaohongshuLoginSession(selectedAccountId);
          if (!sessionInfo) {
            showXiaohongshuStatus({ message: '无法启动登录会话，请稍后重试', action: 'relogin' });
            return;
          }

          // 登录成功（API返回成功说明用户已完成扫码登录）
          // 注意：sessionInfo不为null就说明登录流程已启动，success字段表示是否成功
          if (sessionInfo && sessionInfo.success !== false) {
            hideXiaohongshuStatus();
            // 刷新登录状态以更新UI
            await refreshXiaohongshuLoginStatus();
            alert('登录成功！');
          } else {
            showXiaohongshuStatus({ message: '登录失败，请重新登录', action: 'relogin' });
          }
        } catch (error) {
          console.error('[editor] 启动小红书登录流程失败', error);
          showXiaohongshuStatus({ message: '启动登录流程失败，请稍后重试', action: 'relogin' });
        } finally {
          // 恢复按钮状态
          if (xiaohongshuElements.reloginButton) {
            xiaohongshuElements.reloginButton.disabled = false;
            xiaohongshuElements.reloginButton.textContent = '去重新登录';
          }
        }
      }

      zhihuElements.reloginButton?.addEventListener('click', () => {
        startZhihuLoginFlow();
      });

      zhihuElements.select?.addEventListener('change', async () => {
        stopPolling();
        await refreshChannelLoginStatus();
      });

      const zhihuToggle = document.querySelector('.channel-toggle-input[data-channel="zhihu"]');
      zhihuToggle?.addEventListener('change', async (event) => {
        if (event.target.checked) {
          await ensureInitialLoad();
        } else {
          stopPolling();
        }
      });

      const zhihuRefreshButton = document.querySelector('.channel-refresh[data-channel="zhihu"]');
      zhihuRefreshButton?.addEventListener('click', async () => {
        await ensureInitialLoad();
      });

      // 小红书刷新按钮事件处理
      const xiaohongshuRefreshButton = document.querySelector('.channel-refresh[data-channel="xiaohongshu"]');
      if (xiaohongshuRefreshButton) {
        console.log('[editor] 小红书刷新按钮已找到，绑定事件监听器');
        xiaohongshuRefreshButton.addEventListener('click', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          console.log('[editor] 小红书刷新按钮被点击');
          try {
            const originalText = xiaohongshuRefreshButton.textContent;
            xiaohongshuRefreshButton.disabled = true;
            xiaohongshuRefreshButton.textContent = '刷新中...';
            xiaohongshuRefreshButton.setAttribute('aria-busy', 'true');
            
            console.log('[editor] 开始刷新小红书配置...');
            await ensureXiaohongshuInitialLoad();
            console.log('[editor] 小红书配置刷新完成');
            
            xiaohongshuRefreshButton.disabled = false;
            xiaohongshuRefreshButton.textContent = originalText;
            xiaohongshuRefreshButton.removeAttribute('aria-busy');
            sidebarMeta.textContent = `上次同步：${new Date().toLocaleTimeString()}`;
          } catch (error) {
            console.error('[editor] 刷新小红书配置失败', error);
            xiaohongshuRefreshButton.disabled = false;
            xiaohongshuRefreshButton.textContent = '刷新配置';
            xiaohongshuRefreshButton.removeAttribute('aria-busy');
            alert('刷新配置失败：' + (error.message || '未知错误'));
          }
        });
      } else {
        console.warn('[editor] 警告：未找到小红书刷新按钮！');
      }

      // 小红书发布按钮事件处理
      const xiaohongshuPublishButton = document.querySelector('.channel-publish[data-channel="xiaohongshu"]');
      if (xiaohongshuPublishButton) {
        console.log('[editor] 小红书发布按钮已找到，绑定事件监听器');
        xiaohongshuPublishButton.addEventListener('click', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          console.log('[editor] 小红书发布按钮被点击');
          
          try {
            // 验证必填项
            const title = document.getElementById('titleInput')?.value.trim();
            if (!title) {
              alert('请先填写标题');
              return;
            }

            // 获取内容
            const editorInstance = tinymce.get(EDITOR_ID);
            let content = '';
            let plainText = '';
            
            if (editorInstance) {
              if (isMarkdownMode && editorInstance.mode.get() === 'source') {
                // Markdown模式
                content = editorInstance.getContent({ format: 'text' });
                plainText = markdownToPlainText(content, true);
              } else {
                // HTML模式
                content = editorInstance.getContent({ format: 'html' });
                plainText = markdownToPlainText(content, false);
              }
            }

            if (!content && !plainText && !confirm('正文为空，是否继续只发布标题？')) {
              return;
            }

            // 获取账号和标签
            const accountId = document.getElementById('xiaohongshuAccountSelect')?.value || 'account_1';
            const tags = document.getElementById('xiaohongshuTags')?.value.trim() || '';
            
            // 创建任务数据
            const taskId = `${Date.now()}_${Math.random().toString(36).slice(2, 11)}`;
            const task = {
              type: 'AIFA_TASK',
              platform: 'xiaohongshu',
              taskId,
              autoPublish: false,
              payload: {
                title,
                content: plainText,  // 纯文本
                tags: tags.split(',').map(t => t.trim()).filter(t => t),
                accountId
              }
            };

            // 更新按钮状态
            const originalText = xiaohongshuPublishButton.textContent;
            xiaohongshuPublishButton.disabled = true;
            xiaohongshuPublishButton.textContent = '发布中...';
            xiaohongshuPublishButton.setAttribute('aria-busy', 'true');

            console.log('[editor] 开始发布到小红书...', task);
            
            // 调用发布接口
            const result = await publishToXiaohongshu(task);
            
            // 保存发布历史
            saveHistoryAfterPublish(task, result);
            
            // 显示成功提示
            alert(result.message || '发布成功！');
            
            // 恢复按钮状态
            xiaohongshuPublishButton.disabled = false;
            xiaohongshuPublishButton.textContent = originalText;
            xiaohongshuPublishButton.removeAttribute('aria-busy');
            
          } catch (error) {
            console.error('[editor] 发布失败:', error);
            alert('发布失败：' + (error.message || '未知错误'));
            
            // 恢复按钮状态
            const xiaohongshuPublishButton = document.querySelector('.channel-publish[data-channel="xiaohongshu"]');
            if (xiaohongshuPublishButton) {
              xiaohongshuPublishButton.disabled = false;
              xiaohongshuPublishButton.textContent = '发布';
              xiaohongshuPublishButton.removeAttribute('aria-busy');
            }
            
            // 即使发布失败也尝试保存历史（用于记录失败原因）
            try {
              const title = document.getElementById('titleInput')?.value.trim();
              const editorInstance = tinymce.get(EDITOR_ID);
              let content = '';
              if (editorInstance) {
                if (isMarkdownMode && editorInstance.mode.get() === 'source') {
                  content = editorInstance.getContent({ format: 'text' });
                } else {
                  content = editorInstance.getContent({ format: 'html' });
                }
              }
              const accountId = document.getElementById('xiaohongshuAccountSelect')?.value || 'account_1';
              const tags = document.getElementById('xiaohongshuTags')?.value.trim() || '';
              const taskId = `${Date.now()}_${Math.random().toString(36).slice(2, 11)}`;
              const task = {
                type: 'AIFA_TASK',
                platform: 'xiaohongshu',
                taskId,
                autoPublish: false,
                payload: {
                  title,
                  content: markdownToPlainText(content, isMarkdownMode && editorInstance?.mode.get() === 'source'),
                  tags: tags.split(',').map(t => t.trim()).filter(t => t),
                  accountId
                }
              };
              saveHistoryAfterPublish(task, {
                success: false,
                message: error.message || '发布失败'
              });
            } catch (historyError) {
              console.error('保存失败历史失败:', historyError);
            }
          }
        });
      } else {
        console.warn('[editor] 警告：未找到小红书发布按钮！');
      }

      // 小红书重新登录按钮事件处理
      xiaohongshuElements.reloginButton?.addEventListener('click', () => {
        startXiaohongshuLoginFlow();
      });

      // 小红书账号选择下拉框事件处理
      xiaohongshuElements.select?.addEventListener('change', async () => {
        await refreshXiaohongshuLoginStatus();
      });

      // 小红书开关事件处理
      const xiaohongshuToggle = document.querySelector('.channel-toggle-input[data-channel="xiaohongshu"]');
      xiaohongshuToggle?.addEventListener('change', async (event) => {
        if (event.target.checked) {
          await ensureXiaohongshuInitialLoad();
        }
      });

      const refreshAllTrigger = document.getElementById('refreshAllChannels');
      refreshAllTrigger?.addEventListener('click', async () => {
        // 刷新所有已开启的通道
        const zhihuToggle = document.querySelector('.channel-toggle-input[data-channel="zhihu"]');
        const xiaohongshuToggle = document.querySelector('.channel-toggle-input[data-channel="xiaohongshu"]');
        
        if (zhihuToggle?.checked) {
          await ensureInitialLoad();
        }
        if (xiaohongshuToggle?.checked) {
          await ensureXiaohongshuInitialLoad();
        }
        
        sidebarMeta.textContent = `上次同步：${new Date().toLocaleTimeString()}`;
      });

      const originalSetChannelExpanded = setChannelExpanded;
      setChannelExpanded = async function (channelId, expanded) {
        originalSetChannelExpanded.call(null, channelId, expanded);
        if (channelId === 'zhihu' && expanded) {
          await ensureInitialLoad();
        } else if (channelId === 'xiaohongshu' && expanded) {
          await ensureXiaohongshuInitialLoad();
        }
      };

      initializeSidebarState();
    } catch (error) {
      console.error('[editor] 初始化失败', error);
    }
  </script>
</body>
</html>
